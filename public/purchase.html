<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Purchase Vehicle | TeslaMarketplace</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f5f5f5;color:#111}.wrap{max-width:720px;margin:60px auto;padding:24px}.card{background:#fff;border-radius:20px;padding:32px;box-shadow:0 8px 30px #0001}input,textarea,button{width:100%;padding:14px;margin:8px 0;border:1px solid #ccc;border-radius:9px;box-sizing:border-box}button{background:#111;color:#fff;border:0;cursor:pointer}.summary{background:#f5f5f5;padding:18px;border-radius:12px;margin-bottom:20px}.success{padding:20px;background:#eef8ef;border-radius:12px;margin-top:20px}</style></head><body><main class="wrap"><div class="card"><h1>Purchase this vehicle</h1><div id="vehicle" class="summary">Loading vehicle…</div><form id="form"><input name="name" placeholder="Full name" required><input name="email" type="email" placeholder="Email address" required><input name="phone" placeholder="Phone number"><textarea name="notes" placeholder="Additional notes"></textarea><button>Submit purchase request</button></form><div id="result"></div></div></main><script>const id=new URLSearchParams(location.search).get('id');const box=document.getElementById('vehicle');fetch('/api/vehicles/'+encodeURIComponent(id||'')).then(r=>r.json()).then(j=>{if(!j.data)throw Error(j.error||'Vehicle not found');const v=j.data;box.innerHTML='<b>'+v.year+' '+v.model+'</b><br>$'+Number(v.price).toLocaleString()+' · '+(v.range||'—')+' mile range'}).catch(e=>box.textContent=e.message);document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const body=Object.fromEntries(new FormData(e.target));body.vehicleId=id;const r=await fetch('/api/purchase-requests',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json();document.getElementById('result').innerHTML=r.ok?'<div class="success"><b>Purchase request received.</b><p>Tracking ID: <strong>'+j.data.trackingId+'</strong></p><p>Save this Tracking ID for your order updates.</p><a href="/track.html">Track your order</a></div>':'<p>'+j.error+'</p>'});</script></body></html>

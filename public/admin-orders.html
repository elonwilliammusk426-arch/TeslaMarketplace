<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner Orders | TeslaMarketplace</title><style>body{font-family:system-ui;margin:0;background:#f5f5f5;color:#111}.wrap{max-width:1100px;margin:auto;padding:40px 20px}.top{display:flex;justify-content:space-between;align-items:center}.card{background:#fff;border-radius:18px;padding:24px;margin:16px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:15px}.muted{color:#666}.pill{display:inline-block;padding:6px 10px;border-radius:99px;background:#eee;font-size:12px}select,button{padding:11px;border:1px solid #ccc;border-radius:8px}button{background:#111;color:#fff;cursor:pointer}@media(max-width:700px){.row{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="top"><div><h1>Orders</h1><p class="muted">Owner order control center</p></div><a href="/">Store</a></div><div id="orders">Loading orders…</div></main><script>async function load(){const r=await fetch('/api/admin/orders');const j=await r.json();const box=document.getElementById('orders');if(!r.ok){box.innerHTML='<div class="card">Owner authentication is required.</div>';return}box.innerHTML=j.data.map(o=>`<article class="card"><div class="row"><div><h2>${o.trackingId||o.id}</h2><p><b>Vehicle:</b> ${o.vehicle?.year||''} ${o.vehicle?.model||'—'}</p><p><b>Customer:</b> ${o.customer?.name||'—'} · ${o.customer?.email||'—'}</p><p><b>Total:</b> $${Number(o.total||0).toLocaleString()}</p></div><div><span class="pill">${o.status}</span><br><select data-id="${o.id}" style="margin-top:20px"><option>received</option><option>confirmed</option><option>processing</option><option>fulfilled</option><option>cancelled</option></select> <button onclick="update('${o.id}')">Update</button></div></div></article>`).join('')||'<div class="card">No orders.</div>'}async function update(id){const s=document.querySelector(`select[data-id="${id}"]`).value;const r=await fetch('/api/admin/orders/'+encodeURIComponent(id),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:s})});if(r.ok)load();else alert('Unable to update order.')}load();</script></body></html>

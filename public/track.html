<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track Your Order | TeslaMarketplace</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f5f5f5;color:#171717}.wrap{max-width:760px;margin:70px auto;padding:24px}.card{background:#fff;border-radius:18px;padding:32px;box-shadow:0 8px 30px #00000012}input,button{width:100%;padding:15px;margin-top:10px;border-radius:8px;border:1px solid #ccc;box-sizing:border-box}button{background:#171717;color:#fff;border:0;cursor:pointer}.event{padding:16px 0;border-bottom:1px solid #eee}.muted{color:#666}</style></head>
<body><main class="wrap"><div class="card"><h1>Track Your Order</h1><p class="muted">Enter the tracking ID provided with your TeslaMarketplace order.</p><form id="form"><input id="tracking" placeholder="TMX-20260827-7K4P9Q" required><button>Track order</button></form><section id="result"></section></div></main><script>const form=document.getElementById('form'),result=document.getElementById('result');form.addEventListener('submit',async e=>{e.preventDefault();result.innerHTML='<p>Checking order…</p>';try{const r=await fetch('/api/orders/track/'+encodeURIComponent(document.getElementById('tracking').value.trim()));const j=await r.json();if(!r.ok)throw Error(j.error||'Order not found');const o=j.data;result.innerHTML='<hr><h2>'+o.status+'</h2><p><b>Tracking ID:</b> '+o.trackingId+'</p>'+(o.vehicle?'<p><b>Vehicle:</b> '+o.vehicle.model+' ('+o.vehicle.year+')</p>':'')+'<h3>Updates</h3>'+o.events.map(x=>'<div class="event"><b>'+x.status+'</b><br><span class="muted">'+new Date(x.createdAt).toLocaleString()+(x.location?' · '+x.location:'')+'</span>'+(x.note?'<br>'+x.note:'')+'</div>').join('');}catch(err){result.innerHTML='<p>'+err.message+'</p>'}});</script></body></html>
